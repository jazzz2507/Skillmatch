{% extends 'base.html' %}

{% block title %}Edit Project - SkillMatch{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card" style="max-width: 620px;">
    <div class="auth-header">
      <h1 class="auth-title">Edit Project</h1>
      <p class="auth-subtitle">Update project information and required skills.</p>
    </div>

    <form action="{{ url_for('edit_project', project_id=project.id) }}" method="POST">
      <div class="form-group">
        <label for="title" class="form-label">Project Title</label>
        <input 
          type="text" 
          id="title" 
          name="title" 
          class="form-control" 
          value="{{ request.form.get('title', project.title) }}"
          required 
        />
      </div>

      <div class="form-group">
        <label for="description" class="form-label">Project Description</label>
        <textarea 
          id="description" 
          name="description" 
          class="form-control" 
          required
        >{{ request.form.get('description', project.description) }}</textarea>
      </div>

      <div class="form-group">
        <label for="team_size" class="form-label">Target Team Size</label>
        <input 
          type="number" 
          id="team_size" 
          name="team_size" 
          class="form-control" 
          min="1" 
          max="20"
          value="{{ request.form.get('team_size', project.team_size) }}"
          required 
        />
      </div>

      <div class="form-group">
        <label class="form-label">Select Required Skills (Select at least one)</label>
        <div class="checkbox-grid">
          {% for skill in all_skills %}
            <label class="skill-checkbox-label">
              <input 
                type="checkbox" 
                name="skill_ids" 
                value="{{ skill.id }}"
                {% if skill.id in selected_skill_ids %}checked{% endif %}
              />
              <span>{{ skill.skill_name }}</span>
            </label>
          {% endfor %}
        </div>
      </div>

      <div style="display: flex; gap: 1rem; margin-top: 2rem;">
        <button type="submit" class="btn-submit">Save Changes</button>
        <a href="{{ url_for('projects') }}" class="btn-secondary" style="text-align: center; text-decoration: none;">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
